<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC International PWA</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
    <div id="app" class="max-w-md mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
        <header class="bg-blue-950 text-white p-4 text-center">
            <h1 class="font-bold text-sm">AMC INTERNATIONAL</h1>
            <p class="text-[9px] text-amber-400">COMM CENTER INT.</p>
        </header>

        <div id="login-section" class="p-6 space-y-4">
            <h2 class="text-xs font-bold text-center text-blue-950 uppercase">Agent Login</h2>
            <form id="login-form" class="space-y-3">
                <select id="login_agent_code" required class="w-full p-2.5 border rounded-xl text-xs bg-white">
                    <option value="">Select Agent</option>
                    <option value="AMC001">AMC001 - Kabiru Abdullahi</option>
                    <option value="AMC002">AMC002 - Admin Agent</option>
                </select>
                <input type="password" id="login_pass" placeholder="Password (1234)" required class="w-full p-2.5 border rounded-xl text-xs">
                <button type="submit" class="w-full bg-blue-950 text-white p-2.5 rounded-xl text-xs font-bold">Login</button>
            </form>
        </div>

        <main id="main-app-section" class="p-4 space-y-4 hidden">
            <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-xs">
                <span id="user-display" class="font-bold text-blue-900"></span>
                <button onclick="logout()" class="text-red-600 underline font-bold">Logout</button>
            </div>

            <form id="job-form" class="space-y-2 bg-gray-50 p-3 rounded-xl border text-xs">
                <h3 class="font-bold text-blue-950">New Job Entry</h3>
                <input type="text" id="full_name" placeholder="Customer Name" required class="w-full p-2 border rounded bg-white">
                <input type="tel" id="phone" placeholder="Phone Number" required class="w-full p-2 border rounded bg-white">
                <input type="text" id="desc" placeholder="Job Description" required class="w-full p-2 border rounded bg-white">
                <div class="grid grid-cols-3 gap-1">
                    <input type="number" id="total_bill" placeholder="Bill" value="0" class="p-2 border rounded bg-white">
                    <input type="number" id="amount_paid" placeholder="Paid" value="0" class="p-2 border rounded bg-white">
                    <input type="number" id="debt_balance" placeholder="Debt" value="0" readonly class="p-2 border bg-gray-200 rounded font-bold text-red-600">
                </div>
                <button type="submit" class="w-full bg-blue-950 text-white p-2 rounded font-bold">Submit Job</button>
            </form>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-gray-800">Live Jobs Feed</h3>
                    <button onclick="loadJobs()" class="text-[10px] bg-blue-600 text-white px-2 py-1 rounded">Refresh</button>
                </div>
                <div id="jobs-list" class="space-y-2 text-xs">
                    <p class="text-gray-500 text-center">Loading...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://zaenyapuytutdrjjssul.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_rZw7m05XbbkwRtPfavRqqQ_Ab_TYkgN';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('login_agent_code').value;
            const pass = document.getElementById('login_pass').value;
            if(pass === '1234') {
                const agent = { code, name: code === 'AMC001' ? 'Kabiru Abdullahi' : 'Admin Agent' };
                localStorage.setItem('amci_user', JSON.stringify(agent));
                initApp(agent);
            } else {
                alert('Incorrect password! Use 1234');
            }
        });

        function initApp(agent) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-app-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = agent.code + ' - ' + agent.name;
            loadJobs();
        }

        function logout() {
            localStorage.removeItem('amci_user');
            document.getElementById('main-app-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        window.onload = function() {
            const saved = localStorage.getItem('amci_user');
            if(saved) initApp(JSON.parse(saved));
        }

        const billInput = document.getElementById('total_bill');
        const paidInput = document.getElementById('amount_paid');
        const debtInput = document.getElementById('debt_balance');

        function calc() {
            debtInput.value = Math.max(0, (parseFloat(billInput.value) || 0) - (parseFloat(paidInput.value) || 0));
        }
        billInput.addEventListener('input', calc);
        paidInput.addEventListener('input', calc);

        async function loadJobs() {
            const { data, error } = await _supabase.from('jobs').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('jobs-list');
            if(error) {
                container.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
                return;
            }
            if(!data || data.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center">No jobs found.</p>`;
                return;
            }
            container.innerHTML = data.map(j => `
                <div class="p-2.5 bg-gray-50 border rounded-xl flex justify-between items-center">
                    <div>
                        <p class="font-bold text-gray-900">${j.full_name || j.customer_first_name || 'Customer'} <span class="text-blue-900">[${j.agent_code || j.agent_id}]</span></p>
                        <p class="text-[10px] text-gray-500">${j.description || j.desc || 'Job'} | ₦${j.total_bill || j.amount || 0}</p>
                    </div>
                    <span class="text-[10px] font-bold text-red-600">Debt: ₦${j.debt_balance || j.debt || 0}</span>
                </div>
            `).join('');
        }

        document.getElementById('job-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('amci_user') || '{}');
            const record = {
                agent_code: user.code || 'AMC001',
                full_name: document.getElementById('full_name').value,
                phone: document.getElementById('phone').value,
                description: document.getElementById('desc').value,
                total_bill: parseFloat(billInput.value) || 0,
                amount_paid: parseFloat(paidInput.value) || 0,
                debt_balance: parseFloat(debtInput.value) || 0
            };
            const { error } = await _supabase.from('jobs').insert([record]);
            if(error) {
                alert('Error: ' + error.message);
            } else {
                document.getElementById('job-form').reset();
                debtInput.value = '0';
                alert('Saved successfully!');
                loadJobs();
            }
        });

        _supabase
            .channel('public:jobs')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, payload => {
                loadJobs();
            })
            .subscribe();
    </script>
</body>
</html>
