<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC International PWA</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center font-bold text-lg shadow">
            AMC International Dashboard
        </header>

        <!-- Main Content Container -->
        <main class="p-4 flex-1 overflow-y-auto">
            
            <!-- Agent Input Form -->
            <section id="agent-section" class="mb-6 bg-gray-50 p-4 rounded-lg border">
                <h2 class="text-md font-semibold mb-3 text-blue-700">Shigar da Aikin Sabon Abokin Ciniki</h2>
                <form id="job-form" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Sunan Agent (Agent Name)</label>
                        <input type="text" id="agent_name" required class="w-full mt-1 p-2 border rounded text-sm" placeholder="Saka sunanka">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Sunan Farko</label>
                            <input type="text" id="customer_first_name" class="w-full mt-1 p-2 border rounded text-sm" placeholder="Sunan Farko">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Sunan Babba (Surname)</label>
                            <input type="text" id="customer_surname" class="w-full mt-1 p-2 border rounded text-sm" placeholder="Surname">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Lambar Waya</label>
                        <input type="tel" id="phone" class="w-full mt-1 p-2 border rounded text-sm" placeholder="080XXXXXXXX">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Bayanin Aiki (Description)</label>
                        <input type="text" id="description" class="w-full mt-1 p-2 border rounded text-sm" placeholder="Misali: Registration / Enrolment">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Jimlar Kuɗi</label>
                            <input type="number" id="amount" value="0" class="w-full mt-1 p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">An Biya</label>
                            <input type="number" id="amount_paid" value="0" class="w-full mt-1 p-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">Bashi (Debt)</label>
                            <input type="number" id="debt" value="0" readonly class="w-full mt-1 p-2 bg-gray-200 border rounded text-sm">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded text-sm font-semibold hover:bg-blue-700">
                        Ajiye Aikin (Submit Job)
                    </button>
                </form>
            </section>

            <!-- Admin View / Jobs List -->
            <section id="admin-section">
                <h2 class="text-md font-semibold mb-3 text-gray-800">Jerin Ayyuka (Admin Live View)</h2>
                <div id="jobs-list" class="space-y-2">
                    <p class="text-xs text-gray-500">Ana ɗauko bayanai...</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Script Logic with Supabase -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://zaenyapuytutdrjjssul.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_rZw7m05XbbkwRtPfavRqqQ_Ab_TYkgN';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Auto calculate debt
        const amountInput = document.getElementById('amount');
        const amountPaidInput = document.getElementById('amount_paid');
        const debtInput = document.getElementById('debt');

        function calculateDebt() {
            const amt = parseFloat(amountInput.value) || 0;
            const paid = parseFloat(amountPaidInput.value) || 0;
            debtInput.value = Math.max(0, amt - paid);
        }

        amountInput.addEventListener('input', calculateDebt);
        amountPaidInput.addEventListener('input', calculateDebt);

        // Fetch and display jobs
        async function fetchJobs() {
            const { data, error } = await _supabase
                .from('jobs')
                .select('*')
                .order('created_at', { ascending: false });

            const listContainer = document.getElementById('jobs-list');
            if (error) {
                listContainer.innerHTML = `<p class="text-xs text-red-500">Kuskure wajen ɗauko bayanai: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-gray-500">Babu wani aiki da aka shigar a yanzu.</p>`;
                return;
            }

            listContainer.innerHTML = data.map(job => `
                <div class="p-3 bg-gray-50 border rounded text-xs space-y-1 shadow-sm">
                    <div class="flex justify-between font-bold text-blue-800">
                        <span>${job.customer_first_name || ''} ${job.customer_surname || ''}</span>
                        <span>₦${job.amount || 0}</span>
                    </div>
                    <div class="text-gray-600">Wayar: ${job.phone || 'Babu'} | Bayani: ${job.description || 'Babu'}</div>
                    <div class="flex justify-between text-gray-500 pt-1 border-t">
                        <span>Agent: <strong>${job.agent_name}</strong></span>
                        <span class="text-red-600 font-semibold">Bashi: ₦${job.debt || 0}</span>
                    </div>
                </div>
            `).join('');
        }

        // Handle Form Submission
        document.getElementById('job-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newJob = {
                agent_id: 'agent-' + Math.random().toString(36).substring(2, 9),
                agent_name: document.getElementById('agent_name').value,
                customer_first_name: document.getElementById('customer_first_name').value,
                customer_surname: document.getElementById('customer_surname').value,
                phone: document.getElementById('phone').value,
                description: document.getElementById('description').value,
                amount: parseFloat(amountInput.value) || 0,
                amount_paid: parseFloat(amountPaidInput.value) || 0,
                debt: parseFloat(debtInput.value) || 0,
                status: 'Completed'
            };

            const { error } = await _supabase.from('jobs').insert([newJob]);

            if (error) {
                alert('Kuskure wajen tura aikin: ' + error.message);
            } else {
                document.getElementById('job-form').reset();
                debtInput.value = '0';
                alert('An ajiye aikin cikin nasara!');
                fetchJobs();
            }
        });

        // Real-time Subscription (Live Update for Admin)
        _supabase
            .channel('public:jobs')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, payload => {
                fetchJobs(); // Refresh list immediately on any change
            })
            .subscribe();

        // Initial load
        fetchJobs();
    </script>
</body>
</html>
