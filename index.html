<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC INTERNATIONAL - Store & Debt Management System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d2040">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        .brand-bg { background-color: #0d2040; }
        .brand-gold { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        .border-gold { border-color: #d4af37; }
        .logo-box {
            background: linear-gradient(135deg, #0d2040, #1e3a8a);
            border: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        #toastBox {
            transition: all 0.3s ease-in-out;
            transform: translateY(-20px);
            opacity: 0;
        }
        #toastBox.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-slate-200 font-sans text-gray-900 pb-12 select-none min-h-screen">

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed top-12 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none">
        <div id="toastBox" class="pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold max-w-sm w-full hidden border">
            <i id="toastIcon" class="text-base"></i>
            <span id="toastMessage" class="flex-1"></span>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 brand-bg flex flex-col justify-center items-center z-50 p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950 via-slate-900 to-black">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 w-full max-w-sm text-center border-t-4 border-gold">
            <div class="logo-box w-20 h-20 mx-auto mb-3 rounded-full flex flex-col items-center justify-center text-center">
                <span class="text-white font-black text-lg tracking-wider leading-none">AMC</span>
                <span class="brand-gold text-[8px] font-bold tracking-widest mt-0.5">INT'L</span>
            </div>
            
            <h1 class="text-xl font-extrabold text-blue-950 tracking-wide">AMC INTERNATIONAL</h1>
            <p class="text-[10px] text-gray-600 mb-6 font-bold tracking-tight">AA MASOYIN MASOYA COMM CENTER INT.</p>
            
            <div class="grid grid-cols-2 gap-1 border rounded-xl mb-6 overflow-hidden text-xs font-bold bg-gray-100 p-1 shadow-inner">
                <button type="button" id="tabBtnAgent" onclick="switchLoginMode('agent')" class="py-2.5 rounded-lg text-gray-700 transition cursor-pointer">AGENT LOGIN</button>
                <button type="button" id="tabBtnAdmin" onclick="switchLoginMode('admin')" class="py-2.5 rounded-lg bg-red-800 text-white transition cursor-pointer shadow-sm">ADMIN LOGIN</button>
            </div>

            <form id="agentLoginForm" onsubmit="handleAgentLogin(event)" class="space-y-4 hidden">
                <div>
                    <input type="text" id="loginAgentCode" placeholder="Agent Code (e.g. AG01)" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 text-center uppercase font-black text-sm bg-gray-50 shadow-inner">
                </div>
                <div>
                    <input type="password" id="loginAgentPassword" placeholder="Enter Password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 text-center text-sm font-bold bg-gray-50 shadow-inner">
                </div>
                <button type="submit" class="w-full brand-bg text-white font-extrabold py-3 rounded-xl shadow-lg hover:bg-blue-950 transition duration-200 text-sm cursor-pointer">LOGIN AS AGENT</button>
            </form>

            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <input type="text" id="loginAdminCode" value="ADMIN" readonly class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100 text-center uppercase font-black text-sm text-blue-900">
                </div>
                <div>
                    <input type="password" id="loginAdminPassword" placeholder="Enter Admin Password" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-900 text-center text-sm font-bold bg-gray-50 shadow-inner">
                </div>
                <button type="submit" class="w-full bg-red-800 text-white font-extrabold py-3 rounded-xl shadow-lg hover:bg-red-900 transition duration-200 text-sm cursor-pointer">LOGIN AS ADMIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appInterface" class="hidden">
        <header class="brand-bg text-white p-4 shadow-xl sticky top-0 z-40 border-b-2 border-gold backdrop-blur-md bg-opacity-95">
            <div class="flex items-center justify-between max-w-2xl mx-auto">
                <div class="flex items-center space-x-3">
                    <div class="logo-box w-10 h-10 rounded-full flex flex-col items-center justify-center text-center shadow">
                        <span class="text-white font-black text-[10px] leading-none">AMC</span>
                        <span class="brand-gold text-[6px] font-bold">INT'L</span>
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold leading-tight brand-gold">AMC INTERNATIONAL</h1>
                        <p class="text-[9px] text-gray-200 font-semibold tracking-tight">AA MASOYIN MASOYA COMM CENTER INT.</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="activeAgentBadge" class="bg-blue-950 text-xs text-gold px-3 py-1.5 rounded-xl border border-gold font-bold shadow-inner uppercase"></span>
                    <button onclick="logout()" class="text-red-200 hover:text-white text-sm p-2 rounded-xl bg-red-950/80 border border-red-800/50 cursor-pointer transition shadow" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <main class="max-w-2xl mx-auto p-4 space-y-4">
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                <div class="bg-white p-3.5 rounded-2xl shadow-md border-l-4 border-blue-900">
                    <p class="text-[10px] text-gray-600 font-bold uppercase">Total Work</p>
                    <p id="totalRevenue" class="text-xs font-black text-blue-950 mt-1">₦0</p>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-md border-l-4 border-green-600">
                    <p class="text-[10px] text-gray-600 font-bold uppercase">Collected</p>
                    <p id="totalPaid" class="text-xs font-black text-green-700 mt-1">₦0</p>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-md border-l-4 border-amber-600">
                    <p class="text-[10px] text-gray-600 font-bold uppercase">Agent Comm.</p>
                    <p id="totalCommissions" class="text-xs font-black text-amber-700 mt-1">₦0</p>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-md border-l-4 border-red-500">
                    <p class="text-[10px] text-gray-600 font-bold uppercase">Pending Debt</p>
                    <p id="totalDebt" class="text-xs font-black text-red-600 mt-1">₦0</p>
                </div>
            </div>

            <!-- TABS -->
            <div id="navTabsContainer" class="flex flex-wrap gap-1 bg-white p-1.5 rounded-2xl shadow-md text-xs font-extrabold border border-gray-100">
                <button onclick="switchTab('newJob')" id="tabNewJob" class="flex-1 py-2.5 rounded-xl brand-bg text-white transition cursor-pointer">New Job</button>
                <button onclick="switchTab('debts')" id="tabDebts" class="flex-1 py-2.5 rounded-xl text-gray-700 hover:bg-gray-100 transition cursor-pointer">Debts</button>
                <button onclick="switchTab('history')" id="tabHistory" class="flex-1 py-2.5 rounded-xl text-gray-700 hover:bg-gray-100 transition cursor-pointer">History</button>
                <button onclick="switchTab('report')" id="tabReport" class="flex-1 py-2.5 rounded-xl text-gray-700 hover:bg-gray-100 transition cursor-pointer">Report</button>
            </div>

            <!-- TAB 1: NEW JOB -->
            <section id="secNewJob" class="bg-white p-6 rounded-3xl shadow-md space-y-4 border border-gray-100">
                <h2 class="font-extrabold text-blue-950 text-sm border-b pb-2.5 flex items-center gap-2"><i class="fas fa-file-invoice-dollar brand-gold text-base"></i> Record Job / Sale</h2>
                <form id="jobForm" onsubmit="saveTransaction(event)" class="space-y-3.5">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="text-xs text-gray-700 font-bold">First Name</label>
                            <input type="text" id="custFirstName" required class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-bold uppercase bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                        </div>
                        <div>
                            <label class="text-xs text-gray-700 font-bold">Surname</label>
                            <input type="text" id="custSurname" required class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-bold uppercase bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-700 font-bold">Phone Number</label>
                        <input type="tel" id="custPhone" placeholder="080..." class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-bold bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                    </div>
                    <div>
                        <label class="text-xs text-gray-700 font-bold">Job / Product Description</label>
                        <textarea id="jobDesc" required rows="2" class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-bold bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="text-xs text-gray-700 font-bold">Total Bill (₦)</label>
                            <input type="number" id="totalBill" required min="0" oninput="calcDebt()" class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-black text-blue-900 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                        </div>
                        <div>
                            <label class="text-xs text-gray-700 font-bold">Amount Paid (₦)</label>
                            <input type="number" id="amountPaid" required min="0" oninput="calcDebt()" class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-black text-green-700 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-gray-700 font-bold">Agent Commission (₦)</label>
                        <input type="number" id="agentCommission" min="0" value="0" class="w-full mt-1 px-3.5 py-3 border rounded-xl text-sm font-black text-amber-700 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-900 transition">
                    </div>
                    <div id="debtNotice" class="hidden p-3 bg-red-50 text-red-700 text-xs rounded-xl font-black text-center border border-red-200">
                        Remaining Debt: ₦<span id="calculatedDebt">0</span>
                    </div>
                    <button type="submit" id="saveBtn" class="w-full brand-bg text-white font-extrabold py-3.5 rounded-xl text-sm shadow-lg hover:bg-blue-950 transition cursor-pointer flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i> SAVE RECORD
                    </button>
                </form>
            </section>

            <!-- TAB 2: DEBTS -->
            <section id="secDebtList" class="hidden space-y-3">
                <div class="bg-white p-3.5 rounded-2xl shadow-md border border-gray-100 flex gap-2">
                    <input type="text" id="searchDebt" onkeyup="renderDebts()" placeholder="Search debt by name or phone..." class="w-full px-4 py-3 border rounded-xl text-xs font-bold bg-gray-50 focus:bg-white transition">
                </div>
                <div id="debtContainer" class="space-y-2.5"></div>
            </section>

            <!-- TAB 3: HISTORY -->
            <section id="secHistory" class="hidden space-y-3">
                <div class="bg-white p-3.5 rounded-2xl shadow-md border border-gray-100">
                    <input type="text" id="searchHistory" onkeyup="renderHistory()" placeholder="Search history by name, phone or description..." class="w-full px-4 py-3 border rounded-xl text-xs font-bold bg-gray-50 focus:bg-white transition">
                </div>
                <div id="historyContainer" class="space-y-2.5"></div>
            </section>

            <!-- TAB 4: AGENT REPORT -->
            <section id="secAgentReport" class="hidden space-y-4">
                <div class="bg-white p-6 rounded-3xl shadow-md space-y-3.5 border border-gray-100">
                    <h2 class="font-extrabold text-blue-950 text-sm border-b pb-2 flex items-center justify-between">
                        <span>Agent Performance & Excel Export</span>
                        <button onclick="exportToExcel()" class="bg-green-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-green-800 transition cursor-pointer shadow"><i class="fas fa-file-excel mr-1"></i> Export Excel</button>
                    </h2>
                    <div id="reportContainer" class="space-y-2 text-xs"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = 'https://zaenyapuytutdrjjssul.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_rZw7m05XbbkwRtPfavRqqQ_Ab_TYkgN';
        let supabaseClient = null;

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { 
            console.error('Supabase connection error:', e); 
        }

        let currentUser = null;
        let transactions = [];

        async function initApp() {
            await fetchTransactions();
        }

        async function fetchTransactions() {
            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .order('date', { ascending: false });
                
                if (!error && data) {
                    transactions = data.map(t => ({
                        id: t.id,
                        date: t.date,
                        agent: t.agent,
                        firstName: t.first_name,
                        surname: t.surname,
                        phone: t.phone,
                        description: t.description,
                        totalBill: Number(t.total_bill),
                        amountPaid: Number(t.amount_paid),
                        commission: Number(t.commission),
                        debt: Number(t.debt)
                    }));
                } else {
                    transactions = JSON.parse(localStorage.getItem('amc_transactions') || '[]');
                }
            } else {
                transactions = JSON.parse(localStorage.getItem('amc_transactions') || '[]');
            }
            updateDashboard();
        }

        function showToast(message, type = 'success') {
            const box = document.getElementById('toastBox');
            const msg = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');
            msg.textContent = message;
            box.className = `pointer-events-auto flex items-center gap-3 px-5 py-3 rounded-2xl shadow-2xl text-white text-xs font-bold max-w-sm w-full show ${type === 'success' ? 'bg-green-700 border-green-500' : 'bg-red-700 border-red-500'}`;
            icon.className = type === 'success' ? 'fas fa-check-circle text-base' : 'fas fa-exclamation-circle text-base';
            setTimeout(() => box.classList.remove('show'), 3000);
        }

        function switchLoginMode(mode) {
            if(mode === 'agent') {
                document.getElementById('agentLoginForm').classList.remove('hidden');
                document.getElementById('adminLoginForm').classList.add('hidden');
                document.getElementById('tabBtnAgent').className = 'py-2.5 rounded-lg brand-bg text-white transition cursor-pointer shadow-sm';
                document.getElementById('tabBtnAdmin').className = 'py-2.5 rounded-lg text-gray-700 transition cursor-pointer';
            } else {
                document.getElementById('agentLoginForm').classList.add('hidden');
                document.getElementById('adminLoginForm').classList.remove('hidden');
                document.getElementById('tabBtnAdmin').className = 'py-2.5 rounded-lg bg-red-800 text-white transition cursor-pointer shadow-sm';
                document.getElementById('tabBtnAgent').className = 'py-2.5 rounded-lg text-gray-700 transition cursor-pointer';
            }
        }

        function handleAgentLogin(e) {
            e.preventDefault();
            const code = document.getElementById('loginAgentCode').value.toUpperCase();
            currentUser = { code: code, role: 'agent' };
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appInterface').classList.remove('hidden');
            document.getElementById('activeAgentBadge').textContent = 'Agent: ' + code;
            initApp();
            showToast('Welcome Agent ' + code);
        }

        // FIXED: Admin Login Function Added Here
        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('loginAdminPassword').value;
            // You can change 'admin123' to whatever password you prefer for the admin
            if(pass === 'admin123' || pass === 'ADMIN') {
                currentUser = { code: 'ADMIN', role: 'admin' };
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appInterface').classList.remove('hidden');
                document.getElementById('activeAgentBadge').textContent = 'Administrator';
                initApp();
                showToast('Welcome Admin');
            } else {
                showToast('Invalid Admin Password', 'error');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('appInterface').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function switchTab(tab) {
            document.getElementById('secNewJob').classList.add('hidden');
            document.getElementById('secDebtList').classList.add('hidden');
            document.getElementById('secHistory').classList.add('hidden');
            document.getElementById('secAgentReport').classList.add('hidden');
            
            ['tabNewJob', 'tabDebts', 'tabHistory', 'tabReport'].forEach(t => {
                document.getElementById(t).className = 'flex-1 py-2.5 rounded-xl text-gray-700 hover:bg-gray-100 transition cursor-pointer';
            });

            if(tab === 'newJob') {
                document.getElementById('secNewJob').classList.remove('hidden');
                document.getElementById('tabNewJob').className = 'flex-1 py-2.5 rounded-xl brand-bg text-white transition cursor-pointer';
            } else if(tab === 'debts') {
                document.getElementById('secDebtList').classList.remove('hidden');
                document.getElementById('tabDebts').className = 'flex-1 py-2.5 rounded-xl brand-bg text-white transition cursor-pointer';
                renderDebts();
            } else if(tab === 'history') {
                document.getElementById('secHistory').classList.remove('hidden');
                document.getElementById('tabHistory').className = 'flex-1 py-2.5 rounded-xl brand-bg text-white transition cursor-pointer';
                renderHistory();
            } else if(tab === 'report') {
                document.getElementById('secAgentReport').classList.remove('hidden');
                document.getElementById('tabReport').className = 'flex-1 py-2.5 rounded-xl brand-bg text-white transition cursor-pointer';
                renderReport();
            }
        }

        function calcDebt() {
            const bill = parseFloat(document.getElementById('totalBill').value) || 0;
            const paid = parseFloat(document.getElementById('amountPaid').value) || 0;
            const debt = bill - paid;
            const notice = document.getElementById('debtNotice');
            if(debt > 0) {
                notice.classList.remove('hidden');
                document.getElementById('calculatedDebt').textContent = debt.toLocaleString();
            } else {
                notice.classList.add('hidden');
            }
        }

        async function saveTransaction(e) {
            e.preventDefault();
            const totalBill = parseFloat(document.getElementById('totalBill').value) || 0;
            const amountPaid = parseFloat(document.getElementById('amountPaid').value) || 0;
            
            const txData = {
                id: 'TX-' + Date.now(),
                agent: currentUser ? currentUser.code : 'UNKNOWN',
                first_name: document.getElementById('custFirstName').value.toUpperCase(),
                surname: document.getElementById('custSurname').value.toUpperCase(),
                phone: document.getElementById('custPhone').value,
                description: document.getElementById('jobDesc').value,
                total_bill: totalBill,
                amount_paid: amountPaid,
                commission: parseFloat(document.getElementById('agentCommission').value) || 0,
                debt: totalBill - amountPaid
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('transactions').insert([txData]);
                if (error) {
                    showToast('Error saving to cloud database!', 'error');
                    console.error(error);
                    return;
                }
            }

            document.getElementById('jobForm').reset();
            document.getElementById('debtNotice').classList.add('hidden');
            await fetchTransactions();
            showToast('Transaction saved successfully!');
        }

        function updateDashboard() {
            let rev = 0, paid = 0, comm = 0, debt = 0;
            transactions.forEach(t => {
                rev += t.totalBill;
                paid += t.amountPaid;
                comm += t.commission;
                debt += Math.max(0, t.debt);
            });
            document.getElementById('totalRevenue').textContent = '₦' + rev.toLocaleString();
            document.getElementById('totalPaid').textContent = '₦' + paid.toLocaleString();
            document.getElementById('totalCommissions').textContent = '₦' + comm.toLocaleString();
            document.getElementById('totalDebt').textContent = '₦' + debt.toLocaleString();
        }

        function renderDebts() {
            const query = (document.getElementById('searchDebt').value || '').toLowerCase();
            const container = document.getElementById('debtContainer');
            container.innerHTML = '';
            
            const list = transactions.filter(t => t.debt > 0 && (t.firstName.toLowerCase().includes(query) || t.surname.toLowerCase().includes(query) || t.phone.includes(query)));
            if(list.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-500 py-4 font-bold">No pending debts found.</p>';
                return;
            }

            list.forEach(t => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-md border-l-4 border-red-500 space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-extrabold text-blue-950 text-xs">${t.firstName} ${t.surname}</h4>
                            <p class="text-[10px] text-gray-500 font-bold"><i class="fas fa-phone mr-1"></i>${t.phone || 'N/A'}</p>
                        </div>
                        <span class="text-xs font-black text-red-600 bg-red-50 px-2.5 py-1 rounded-xl border border-red-200">Debt: ₦${t.debt.toLocaleString()}</span>
                    </div>
                    <p class="text-xs text-gray-700 font-medium">${t.description}</p>
                    <div class="flex justify-between items-center pt-2 border-t text-[10px] font-bold text-gray-500">
                        <span>Agent: ${t.agent}</span>
                        <button onclick="clearDebt('${t.id}')" class="bg-green-700 text-white px-3 py-1.5 rounded-xl hover:bg-green-800 transition cursor-pointer">Mark Paid</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function clearDebt(id) {
            const tx = transactions.find(t => t.id === id);
            if(tx) {
                const newPaid = tx.amountPaid + tx.debt;
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('transactions')
                        .update({ amount_paid: newPaid, debt: 0 })
                        .eq('id', id);
                    
                    if (error) {
                        showToast('Error updating debt status', 'error');
                        return;
                    }
                }
                await fetchTransactions();
                renderDebts();
                showToast('Debt marked as fully paid!');
            }
        }

        function renderHistory() {
            const query = (document.getElementById('searchHistory').value || '').toLowerCase();
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            const list = transactions.filter(t => t.firstName.toLowerCase().includes(query) || t.surname.toLowerCase().includes(query) || t.phone.includes(query) || t.description.toLowerCase().includes(query));
            if(list.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-gray-500 py-4 font-bold">No history records found.</p>';
                return;
            }

            list.forEach(t => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-md border border-gray-100 space-y-2';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-extrabold text-blue-950 text-xs">${t.firstName} ${t.surname}</h4>
                            <p class="text-[10px] text-gray-500 font-bold">${new Date(t.date).toLocaleDateString()} | Agent: ${t.agent}</p>
                        </div>
                        <span class="text-xs font-black text-blue-900">₦${t.totalBill.toLocaleString()}</span>
                    </div>
                    <p class="text-xs text-gray-700 font-medium">${t.description}</p>
                    <div class="flex justify-between text-[10px] font-bold text-gray-500 pt-1 border-t">
                        <span class="text-green-700">Paid: ₦${t.amountPaid.toLocaleString()}</span>
                        <span class="${t.debt > 0 ? 'text-red-600' : 'text-gray-400'}">Debt: ₦${t.debt.toLocaleString()}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderReport() {
            const container = document.getElementById('reportContainer');
            let totalJobs = transactions.length;
            let totalRev = transactions.reduce((sum, t) => sum + t.totalBill, 0);
            let totalColl = transactions.reduce((sum, t) => sum + t.amountPaid, 0);
            let totalDebts = transactions.reduce((sum, t) => sum + t.debt, 0);

            container.innerHTML = `
                <div class="p-3 bg-gray-50 rounded-xl flex justify-between font-bold"><span>Total Jobs Recorded:</span> <span class="text-blue-950">${totalJobs}</span></div>
                <div class="p-3 bg-gray-50 rounded-xl flex justify-between font-bold"><span>Total Work Value:</span> <span class="text-blue-950">₦${totalRev.toLocaleString()}</span></div>
                <div class="p-3 bg-gray-50 rounded-xl flex justify-between font-bold"><span>Total Cash Collected:</span> <span class="text-green-700">₦${totalColl.toLocaleString()}</span></div>
                <div class="p-3 bg-gray-50 rounded-xl flex justify-between font-bold"><span>Total Outstanding Debts:</span> <span class="text-red-600">₦${totalDebts.toLocaleString()}</span></div>
            `;
        }

        function exportToExcel() {
            if(transactions.length === 0) {
                showToast('No records to export!', 'error');
                return;
            }
            const data = transactions.map(t => ({
                "ID": t.id,
                "Date": new Date(t.date).toLocaleString(),
                "Agent": t.agent,
                "First Name": t.firstName,
                "Surname": t.surname,
                "Phone": t.phone,
                "Description": t.description,
                "Total Bill (₦)": t.totalBill,
                "Amount Paid (₦)": t.amountPaid,
                "Debt (₦)": t.debt,
                "Commission (₦)": t.commission
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "AMC_Transactions");
            XLSX.writeFile(wb, "AMC_International_Report.xlsx");
            showToast('Excel report downloaded successfully!');
        }
    </script>
</body>
</html>
